[package]
name = "rust_click"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tiny_http = "0.12"
# BoringSSL based impersonation client (rquest/wreq family): custom ciphers,
# curves, sigalgs, extension permutation, GREASE and HTTP/2 fingerprint.
wreq = "=0.15.3"
# Community emulation profiles (Chrome/Safari/Firefox/OkHttp) used as fallback.
wreq-util = "=0.1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[[bin]]
name = "rust_click"
path = "src/main.rs"

[lib]
name = "rust_click"
path = "src/lib.rs"
