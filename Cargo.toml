[package]
name = "rust_click"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tiny_http = "0.12"

[[bin]]
name = "rust_click"
path = "src/main.rs"

[lib]
name = "rust_click"
path = "src/lib.rs"
